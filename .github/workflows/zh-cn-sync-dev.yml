name: Zh-CN Dev Sync and Build

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Dev channel - sync, replay, build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      # 从默认分支触发时也要能拿到测试版分支的代码
      - uses: actions/checkout@v4
        with:
          ref: zh-cn-dev
          fetch-depth: 0

      - name: Keep i18n assets
        run: |
          mkdir -p /tmp/assets /tmp/wf
          cp -r scripts/zh-cn/. /tmp/assets/ || true
          rm -f /tmp/assets/workflow.yml /tmp/assets/workflow-dev.yml
          cp .github/workflows/zh-cn-sync-dev.yml /tmp/wf/dev.yml
          if [ -f README.md ]; then cp README.md /tmp/wf/README.md; fi

      - name: Read upstream version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f scripts/zh-cn/decide.py ]; then
            python3 scripts/zh-cn/decide.py dev
          else
            # 首次运行时词典还没搬过来，从默认分支取脚本
            mkdir -p scripts/zh-cn
            curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/zh-cn/decide.py" \
              -o scripts/zh-cn/decide.py
            python3 scripts/zh-cn/decide.py dev
          fi

      - name: Sync with upstream dev
        run: |
          git remote add upstream https://github.com/Akash-Sriram/morphe-google-photos.git || true
          git fetch --depth=1 upstream dev
          git reset --hard FETCH_HEAD
          mkdir -p scripts/zh-cn .github/workflows
          cp -r /tmp/assets/. scripts/zh-cn/
          rm -f scripts/zh-cn/workflow.yml scripts/zh-cn/workflow-dev.yml
          cp /tmp/wf/dev.yml .github/workflows/zh-cn-sync-dev.yml
          if [ -f /tmp/wf/README.md ]; then cp /tmp/wf/README.md README.md; fi
          # 默认分支上那份主通道工作流也要存在，否则从默认分支看不到稳定版按钮
          if [ ! -f .github/workflows/zh-cn-sync.yml ]; then
            curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/workflows/zh-cn-sync.yml" \
              -o .github/workflows/zh-cn-sync.yml || true
          fi

      - name: Replay translation
        run: python3 scripts/zh-cn/apply.py .

      - name: Commit translations
        run: |
          git config user.name "zh-cn-bot"
          git config user.email "zh-cn-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore(zh-CN): 同步上游 dev 并重放中文翻译"
            git push --force origin HEAD:zh-cn-dev
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            ./gradlew :patches:buildAndroid -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }} && exit 0
            echo "第 $i 次构建失败，30 秒后重试（多为依赖仓库限流）"
            sleep 30
          done
          exit 1

      - name: Publish dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          V=$(grep -m1 '^version' gradle.properties | sed 's/^version[[:space:]]*=[[:space:]]*//' | tr -d '\r')
          MPP="patches/build/libs/patches-${V}.mpp"
          if [ ! -f "$MPP" ]; then
            MPP=$(ls -t patches/build/libs/patches-*.mpp | grep -v -e '-sources' -e '-javadoc' | head -1)
          fi
          echo "bundle: $MPP (version $V)"
          SHA8=$(echo "${{ steps.check.outputs.upstream_ref }}" | cut -c1-8)
          cp "$MPP" /tmp/patches-zhcn-dev.mpp
          gh release delete zh-cn-dev-latest --yes --cleanup-tag || true
          gh release create zh-cn-dev-latest /tmp/patches-zhcn-dev.mpp \
            --prerelease \
            --title "中文版补丁包 ${V}（测试版 dev）" \
            --notes "补丁包版本：${V}
          对应上游 dev 提交：${SHA8}（完整 ${{ steps.check.outputs.upstream_ref }}）
          构建时间：$(date -u +%Y-%m-%d\ %H:%M\ UTC)
          功能比稳定版新，稳定性较低。
          安装：下载本页 .mpp，用 Morph Manager 的补丁源 - 本地文件导入。"
